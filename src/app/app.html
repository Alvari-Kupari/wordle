<div class="grid-container">
  @if(this.isSolved()) {
    <div class="completed">
      <h1>Congratulations!</h1>
      <p>You have completed the game.</p>
    </div>
  }
  <grid [guesses]="guesses()" [word]="word()"></grid>
  @if(!this.isSolved()) {
    <guess-form (guessOutput)="makeGuess($event)"></guess-form>
  } @else {
    <button (click)="restartGame()">Replay</button>
  }
</div>
